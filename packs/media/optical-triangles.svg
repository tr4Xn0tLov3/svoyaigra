<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <rect width="600" height="420" rx="20" fill="#f8fafc"/>
  <!-- Outer black outline triangle pointing down -->
  <polygon points="155,130 445,130 300,375" fill="none" stroke="#0f172a" stroke-width="5"/>
  <!-- Three black circles at vertices of upright triangle -->
  <circle cx="300" cy="78" r="44" fill="#0f172a"/>
  <circle cx="160" cy="320" r="44" fill="#0f172a"/>
  <circle cx="440" cy="320" r="44" fill="#0f172a"/>
  <!-- The illusory white upright triangle cutting into circles and outline! -->
  <polygon points="300,78 160,320 440,320" fill="#f8fafc"/>
</svg>