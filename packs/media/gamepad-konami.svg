    <rect x="62" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="88" y="130" fill="#ffffff">↑</text>
    <rect x="126" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="152" y="130" fill="#ffffff">↑</text>
    <rect x="190" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="216" y="130" fill="#ffffff">↓</text>
    <rect x="254" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="280" y="130" fill="#ffffff">↓</text>
    <rect x="318" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="344" y="130" fill="#ffffff">←</text>
    <rect x="382" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="408" y="130" fill="#ffffff">→</text>
    <rect x="446" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="472" y="130" fill="#ffffff">←</text>
    <rect x="510" y="88" width="52" height="64" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="536" y="130" fill="#ffffff">→</text>
    <circle cx="605" cy="120" r="28" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/><text x="605" y="130" fill="#ffffff">B</text>
    <circle cx="672" cy="120" r="28" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/><text x="672" y="130" fill="#ffffff">A</text>
  </g>
  <!-- Retro Gamepad below -->
  <g transform="translate(245, 215)">
    <rect x="0" y="0" width="270" height="105" rx="22" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
    <rect x="14" y="14" width="242" height="77" rx="12" fill="#1e293b"/>
    <!-- D-pad -->
    <rect x="44" y="30" width="16" height="46" rx="2" fill="#e2e8f0"/>
    <rect x="29" y="45" width="46" height="16" rx="2" fill="#e2e8f0"/>
    <!-- Select Start -->
    <rect x="108" y="60" width="22" height="8" rx="4" fill="#64748b"/>
    <rect x="138" y="60" width="22" height="8" rx="4" fill="#64748b"/>
    <!-- B A buttons -->
    <circle cx="195" cy="58" r="13" fill="#ef4444"/>
    <circle cx="230" cy="58" r="13" fill="#ef4444"/>
  </g>
</svg>