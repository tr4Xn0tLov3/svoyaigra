<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <rect width="760" height="360" rx="20" fill="#091128"/>
  <rect x="40" y="55" width="680" height="130" rx="18" fill="#13224a" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Sequence badges: ↑ ↑ ↓ ↓ ← → ← → B A -->
