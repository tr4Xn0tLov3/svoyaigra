<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10204a"/>
      <stop offset="100%" stop-color="#050919"/>
    </radialGradient>
    <radialGradient id="sun" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb5607"/>
    </radialGradient>
    <radialGradient id="mystery" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a8f9ff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" rx="20" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.6">
    <circle cx="90" cy="60" r="1.5"/><circle cx="210" cy="45" r="2"/><circle cx="340" cy="80" r="1.2"/>
    <circle cx="480" cy="50" r="1.8"/><circle cx="630" cy="70" r="2"/><circle cx="740" cy="40" r="1.4"/>
    <circle cx="150" cy="360" r="1.5"/><circle cx="420" cy="370" r="2"/><circle cx="690" cy="355" r="1.6"/>
  </g>
  <!-- Sun -->
  <circle cx="-25" cy="210" r="95" fill="url(#sun)"/>
  <!-- Orbit line -->
  <line x1="70" y1="210" x2="770" y2="210" stroke="#334e8c" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Mercury -->
  <circle cx="105" cy="210" r="9" fill="#9ca3af"/>
  <!-- Venus -->
  <circle cx="160" cy="210" r="16" fill="#eab308"/>
  <!-- Earth -->
  <circle cx="225" cy="210" r="17" fill="#2563eb"/>
  <circle cx="221" cy="206" r="6" fill="#22c55e" opacity="0.85"/>
  <!-- Mars -->
  <circle cx="285" cy="210" r="13" fill="#ef4444"/>
  <!-- Jupiter -->
  <circle cx="385" cy="210" r="46" fill="#d97706"/>
  <rect x="340" y="198" width="90" height="8" rx="4" fill="#fde68a" opacity="0.55"/>
  <rect x="342" y="216" width="86" height="7" rx="3" fill="#92400e" opacity="0.6"/>
  <!-- Saturn -->
  <ellipse cx="515" cy="210" rx="64" ry="16" fill="none" stroke="#fcd34d" stroke-width="6" transform="rotate(-18 515 210)"/>
  <circle cx="515" cy="210" r="36" fill="#f59e0b"/>
  <!-- Mystery Planet #7 tilted 98 deg! -->
  <g transform="translate(645,210)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#f5c542" stroke-width="2.5" stroke-dasharray="5 5"/>
    <ellipse cx="0" cy="0" rx="12" ry="46" fill="none" stroke="#bae6fd" stroke-width="4" opacity="0.85" transform="rotate(8)"/>
    <line x1="-58" y1="8" x2="58" y2="-8" stroke="#f43f5e" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="28" fill="url(#mystery)"/>
    <text x="0" y="10" text-anchor="middle" fill="#06152d" font-family="sans-serif" font-weight="900" font-size="30">?</text>
    <text x="0" y="78" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-weight="700" font-size="16">Наклон оси: 98°</text>
  </g>
  <!-- Neptune -->
  <circle cx="748" cy="210" r="26" fill="#1d4ed8"/>
</svg>