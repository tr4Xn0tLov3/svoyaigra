<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#091536"/>
    </linearGradient>
  </defs>
  <rect width="700" height="285" rx="20" fill="url(#sky)"/>
  <circle cx="350" cy="215" r="72" fill="#fef08a" opacity="0.9"/>
  <!-- Distant mountain -->
  <polygon points="60,285 240,175 410,285" fill="#312e81" opacity="0.7"/>
  <polygon points="320,285 510,165 680,285" fill="#1e1b4b" opacity="0.8"/>
  <!-- Water -->
  <rect y="280" width="700" height="140" fill="url(#sea)"/>
  <!-- Reflection -->
  <g fill="#fde047" opacity="0.35">
    <rect x="305" y="295" width="90" height="5" rx="2.5"/>
    <rect x="318" y="312" width="64" height="4" rx="2"/>
    <rect x="328" y="328" width="44" height="4" rx="2"/>
  </g>
  <!-- Red Torii Gate -->
  <g fill="#dc2626">
    <!-- Top curved kasagi -->
    <path d="M 165 110 Q 350 135 535 110 L 525 130 Q 350 152 175 130 Z"/>
    <rect x="180" y="126" width="340" height="14" rx="3" fill="#991b1b"/>
    <!-- Nuki crossbar -->
    <rect x="200" y="168" width="300" height="16" rx="3"/>
    <!-- Center plaque -->
    <rect x="336" y="136" width="28" height="36" rx="3" fill="#1e293b" stroke="#f5c542" stroke-width="2"/>
    <!-- Main pillars -->
    <rect x="238" y="132" width="26" height="195" rx="3"/>
    <rect x="436" y="132" width="26" height="195" rx="3"/>
    <!-- Side support pillars in water -->
    <rect x="212" y="245" width="14" height="82" rx="2" fill="#b91c1c"/>
    <rect x="474" y="245" width="14" height="82" rx="2" fill="#b91c1c"/>
  </g>
  <!-- Water ripples around base -->
  <g stroke="#93c5fd" stroke-width="2" opacity="0.6" fill="none">
    <path d="M 200 328 Q 245 334 285 328"/>
    <path d="M 415 328 Q 455 334 500 328"/>
  </g>
</svg>