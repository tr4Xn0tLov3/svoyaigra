<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <rect width="700" height="380" rx="20" fill="#07122b"/>
  <!-- DNA double helix schematic -->
  <path d="M 110 110 C 210 110, 230 270, 350 270 C 470 270, 490 110, 590 110" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <path d="M 110 270 C 210 270, 230 110, 350 110 C 470 110, 490 270, 590 270" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  <!-- Base pairs -->
  <g font-family="sans-serif" font-weight="800" font-size="22" text-anchor="middle">
    <!-- Pair 1: A - T -->
    <line x1="150" y1="126" x2="150" y2="254" stroke="#22c55e" stroke-width="6"/>
    <circle cx="150" cy="126" r="20" fill="#22c55e"/><text x="150" y="134" fill="#052e16">A</text>
    <circle cx="150" cy="254" r="20" fill="#eab308"/><text x="150" y="262" fill="#422006">T</text>
    <!-- Pair 2: G - ? -->
    <line x1="350" y1="110" x2="350" y2="270" stroke="#f43f5e" stroke-width="6"/>
    <circle cx="350" cy="110" r="24" fill="#3b82f6"/><text x="350" y="118" fill="#ffffff">G</text>
    <circle cx="350" cy="270" r="26" fill="#f5c542" stroke="#ffffff" stroke-width="3"/><text x="350" y="279" fill="#0f172a">?</text>
    <!-- Pair 3: T - A -->
    <line x1="550" y1="126" x2="550" y2="254" stroke="#22c55e" stroke-width="6"/>
    <circle cx="550" cy="126" r="20" fill="#eab308"/><text x="550" y="134" fill="#422006">T</text>
    <circle cx="550" cy="254" r="20" fill="#22c55e"/><text x="550" y="262" fill="#052e16">A</text>
  </g>
  <text x="350" y="342" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="600">Правило комплементарности азотистых оснований ДНК: Аденин — Тимин, Гуанин — ?</text>
</svg>